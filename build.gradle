plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

base { archivesName = 'candid' }
version = project.version
group = project.group

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    if (System.getenv('CANDID_SHADER_TEST') == 'true') {
        modLocalRuntime files('build/shader-test/dependencies/iris.jar', 'build/shader-test/dependencies/sodium.jar')
        runtimeOnly fileTree(dir: 'build/shader-test/dependencies/libraries', include: ['*.jar'])
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'candid-test'
        enableGameTests = false
        enableClientGameTests = true
        eula = false
    }
}
// Minecraft 1.21.10 processes login packets outside the test harness's legacy
// task queue. Use its supported asynchronous-network mode; tests await state.
loom.runs.named('clientGameTest') {
    vmArg '-Dfabric.client.gametest.disableNetworkSynchronizer=true'
}

processResources {
    inputs.property 'version', version
    filesMatching('fabric.mod.json') { expand 'version': version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
