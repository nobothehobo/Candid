name: Build Candid
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { minecraft: '1.21.10', java: '21' }
          - { minecraft: '1.21.11', java: '21' }
          - { minecraft: '26.1.2', java: '25' }
          - { minecraft: '26.2', java: '25' }
          - { minecraft: '26.3', java: '25' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - run: bash gradlew build -Ptarget=${{ matrix.minecraft }} --stacktrace
      - name: Client and single-player workflow test
        run: xvfb-run -a bash gradlew runClientGameTest -Ptarget=${{ matrix.minecraft }} --stacktrace
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Candid-0.6.0-mc${{ matrix.minecraft }}
          path: build/${{ matrix.minecraft }}/libs/candid-0.6.0+mc${{ matrix.minecraft }}.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Candid-mc${{ matrix.minecraft }}-test-evidence
          path: |
            build/${{ matrix.minecraft }}/reports/tests/
            build/run/clientGameTest/screenshots/
            build/run/clientGameTest/logs/
            build/run/clientGameTest/crash-reports/

  shaders:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Install verified shader test dependencies
        run: python3 tools/setup_shader_test.py
      - name: Shader capture regression
        run: xvfb-run -a bash gradlew runClientGameTest --stacktrace
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          CANDID_SHADER_TEST: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Candid-shader-evidence
          path: |
            build/run/clientGameTest/screenshots/
            build/run/clientGameTest/logs/
            build/run/clientGameTest/crash-reports/
